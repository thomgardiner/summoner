name: Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: summoner-aarch64-apple-darwin.tar.xz
            format: tar
            binary: summoner
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: summoner-x86_64-apple-darwin.tar.xz
            format: tar
            binary: summoner
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            archive: summoner-x86_64-unknown-linux-musl.tar.xz
            format: tar
            binary: summoner
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive: summoner-x86_64-pc-windows-msvc.zip
            format: zip
            binary: summoner.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package tar archive
        if: matrix.format == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          stage="summoner-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar -cJf "${{ matrix.archive }}" "$stage"

      - name: Package zip archive
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $stage = "summoner-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Create aggregate checksum
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            summoner-aarch64-apple-darwin.tar.xz
            summoner-x86_64-apple-darwin.tar.xz
            summoner-x86_64-unknown-linux-musl.tar.xz
            summoner-x86_64-pc-windows-msvc.zip
          )
          for archive in "${expected[@]}"; do
            test -f "artifacts/$archive"
          done
          test "$(find artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 4
          (cd artifacts && sha256sum "${expected[@]}" > sha256.sum)

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(artifacts/*.tar.xz artifacts/*.zip artifacts/sha256.sum)
          test "${#assets[@]}" -eq 5
          gh release create "$GITHUB_REF_NAME" \
            --title "Summoner ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${assets[@]}"
