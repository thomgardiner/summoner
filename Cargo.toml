[package]
name = "summoner"
version = "0.1.0"
edition = "2024"
description = "Small git-worktree fleet runner for coding-agent CLIs."
license = "MIT"
repository = "https://github.com/thomgardiner/summoner"
homepage = "https://github.com/thomgardiner/summoner"
readme = "README.md"
keywords = ["agents", "fleet", "grove", "orchestration", "cli"]
categories = ["development-tools", "command-line-utilities"]
publish = false

[[bin]]
name = "summoner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Clippy defaults do not enable size/complexity lints. Deny them so a 2k-line
# test file (or a 120-line function) fails CI instead of accumulating quietly.
[lints.clippy]
too_many_lines = "deny"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
